name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Point the cache to the server folder since that's where the lockfile is
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests (backend)
        working-directory: server
        run: npm test
        env:
          # These are unused by unit tests but required by env.js when it loads.
          PGPASSWORD: ci-fake-password
          SESSION_SECRET: ci-session-secret-48-chars-minimum-length-for-validation
          CSRF_SECRET: ci-csrf-secret-48-chars-minimum-length-for-validation
          SUPABASE_URL: https://ci-test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-fake-service-role-key
          RESEND_API_KEY: ci-fake-resend-key
          EMAIL_FROM: HOSA <test@example.com>
